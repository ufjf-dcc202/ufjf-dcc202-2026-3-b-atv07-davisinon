<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS em linha</title>
</head>
<body>
    <main>
        <div>
            <h1>CSS em linha</h1>
            <p>Você pode aplicar um estilo <em style="color: orange;">em linha</em> para um elemento usando um atributo <code style="color: lime; text-decoration: underline;font-family: sans-serif;">style</code>.</p>
            <dl>
                <div>
                    <dt><code>color</code></dt>
                    <dd>Cor texto do elemento.</dd>
                </div>
                <div>
                    <dt><code>background-color</code></dt>
                    <dd>Cor de fundo do elemento</dd>
                </div>

            </dl>
        </div>

    </main>
    
</body>
</html>
