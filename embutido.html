<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
    <style>
        em {
            color: orange;
        }
        div > p > code {
            color: lime;
            text-decoration: underline;
            font-family: sans-serif;
        }
        div > dt{
            color: blue;
        }
    </style>
</head>
<body>
    <main>
        <div>
            <h1>CSS Embutido</h1>
            <p>Você pode aplicar um estilo <em> embutido</em> para um grupo de elementos <code> com style</code> abaixo do<code> title</code>.</p>
            <dl>
                <div>
                    <dt><code>color</code></dt>
                    <dd>Cor texto do elemento.</dd>
                </div>
                <div>
                    <dt><code>background-color</code></dt>
                    <dd>Cor de fundo do elemento</dd>
                </div>

            </dl>
        </div>

    </main>
    
</body>
</html>
